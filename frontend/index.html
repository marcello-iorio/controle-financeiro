<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Controle Financeiro</title>
</head>

<body>
    <div class="container">
        <h1>Controle Financeiro</h1>

        <div class="top">
            <div class="card">
                <h2>Nova Movimentação</h2>
                <form id="form">
                    <div class="form-grid">

                        <select id="tipo">
                            <option value="entrada">Entrada</option>
                            <option value="saida">Saída</option>
                        </select>

                        <select id="categoria">
                            <option value="" disabled selected>Selecione uma categoria</option>
                        </select>

                        <input type="number" id="valor" placeholder="Valor">

                        <input type="date" id="data">

                        <input type="text" id="descricao" placeholder="Descrição">

                        <button type="submit">Cadastrar</button>

                    </div>

                    <button type="button" class="btn-categoria" onclick="toggleCategoria()">
                        + Nova categoria
                    </button>
                    <div id="novaCategoriaBox" style="display: none;" class="nova-categoria">
                        <input type="text" id="novaCategoria" placeholder="Nome da categoria">
                        <button onclick="criarCategoria()">Adicionar</button>
                    </div>
                </form>
            </div>
            <div class="card saldo-box">
                <h2 id="saldoTitulo">Saldo Atual</h2>
                <p id="saldo">Carregando...</p>
                <label>Filtrar:</label>
                <select id="filtroTipo">
                    <option value="todos">Todos</option>
                    <option value="entrada">Entradas</option>
                    <option value="saida">Saídas</option>
                </select>

            </div>
        </div>

        <div class="bottom card">
            <h2>Movimentações</h2>
            <ul id="lista"></ul>
        </div>

        <script>

            let editandoId = null;


            const API = "http://127.0.0.1:5000";

            async function carregarMovimentacoes() {
                const response = await fetch(API + "/movimentacoes");
                const dados = await response.json();
                const filtro = document.getElementById("filtroTipo").value;
                const saldoFiltrado = calcularSaldoFiltrado(dados, filtro);
                document.getElementById("saldo").textContent = `R$ ${saldoFiltrado.toFixed(2)}`;
                const titulo = document.querySelector("#saldoTitulo");
                const saldoEl = document.getElementById("saldo");
                
                if (filtro === "entrada") {
                    saldoEl.style.color = "#2ecc71"; // verde
                } else if (filtro === "saida") {
                    saldoEl.style.color = "#e74c3c"; // vermelho
                } else {
                    saldoEl.style.color = saldoFiltrado >= 0 ? "#2ecc71" : "#e74c3c";
                }
                

                if (filtro === "entrada"){
                    titulo.textContent = "Total de Entradas";
                } else if (filtro === "saida"){
                     titulo.textContent = "Total de Saídas";
                }
                else titulo.textContent = "Saldo Atual";

                const lista = document.getElementById("lista");
                lista.innerHTML = "";

                const filtrados = dados.filter(m => {
                    if (filtro === "todos") return true;
                    return m.tipo === filtro;
                });

                filtrados.forEach(m => {
                    const item = document.createElement("li");

                    const valor = Number(m.valor).toFixed(2);
                    const dataFormatada = new Date(m.data).toLocaleDateString("pt-BR");
                    const tipoTexto = m.tipo === "entrada" ? "💰 Entrada" : "💸 Saída";
                    const corValor = m.tipo === "entrada" ? "#2ecc71" : "#e74c3c";

                    item.innerHTML = `
                        <strong>${tipoTexto} - ${m.categoria || "Sem categoria"}</strong><br>
                        <small>${m.descricao || ""}</small><br>
                        <span style="color: ${corValor}">R$ ${valor}</span><br>
                        <small>${dataFormatada}</small>
                    `;

                    const botaoEditar = document.createElement("button");
                    botaoEditar.textContent = "Editar";

                    botaoEditar.onclick = () => carregarParaEdicao(m);

                    item.appendChild(botaoEditar);

                    lista.appendChild(item);
                });
            }

            function calcularSaldoFiltrado(movimentacoes, filtro) {
    let total = 0;

    movimentacoes.forEach(m => {
        if (filtro === "entrada") {
            if (m.tipo === "entrada") {
                total += Number(m.valor);
            }
        } else if (filtro === "saida") {
            if (m.tipo === "saida") {
                total += Number(m.valor); // 👈 soma normal (positivo)
            }
        } else {
            // TODOS (saldo real)
            if (m.tipo === "entrada") {
                total += Number(m.valor);
            } else {
                total -= Number(m.valor);
            }
        }
    });

    return total;
}

            function toggleCategoria() {
                const box = document.getElementById("novaCategoriaBox");

                if (box.style.display === "none") {
                    box.style.display = "flex";
                } else {
                    box.style.display = "none";
                }
            }

            function carregarParaEdicao(m) {

                const dataFormatada = new Date(m.data).toISOString().split("T")[0];

                document.getElementById("tipo").value = m.tipo;
                document.getElementById("valor").value = m.valor;
                document.getElementById("data").value = dataFormatada;
                document.getElementById("descricao").value = m.descricao || "";
                document.getElementById("categoria").value = m.categoria_id || "";

                editandoId = m.id;
                if (editandoId) {
                    document.querySelector("button[type='submit']").textContent = "Atualizar";
                } else {
                    document.querySelector("button[type='submit']").textContent = "Cadastrar";
                }
            }

            async function carregarSaldo() {
                const response = await fetch(API + "/saldo");
                const dados = await response.json();

                const saldoElemento = document.getElementById("saldo");
                saldoElemento.textContent = "R$ " + dados.saldo;

                if (dados.saldo >= 0) {
                    saldoElemento.style.color = "#2ecc71";
                } else {
                    saldoElemento.style.color = "#e74c3c";
                }
            }

            async function carregarCategorias() {
                const response = await fetch(API + "/categorias");
                const categorias = await response.json();

                const select = document.getElementById("categoria");
                select.innerHTML = `
    <option value="" disabled selected>Selecione uma categoria</option>
`;

                categorias.forEach(c => {
                    const option = document.createElement("option");
                    option.value = c.id;
                    option.textContent = c.nome;
                    select.appendChild(option);
                });
            }

            async function criarCategoria() {
                const nome = document.getElementById("novaCategoria").value;

                if (!nome) {
                    alert("Digite um nome para a categoria");
                    return;
                }

                await fetch(API + "/categorias", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nome })
                });

                document.getElementById("novaCategoria").value = "";

                carregarCategorias(); // atualiza o select

                alert("Categoria criada!");
            }

            async function editarCategoria(id) {
                const categoriaId = prompt("Digite o ID da nova categoria:");

                if (!categoriaId) return;

                await fetch(API + "/movimentacoes/" + id, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ categoria_id: categoriaId })
                });

                carregarMovimentacoes();
            }

            document.getElementById("form").addEventListener("submit", async (e) => {
                e.preventDefault();

                const movimentacao = {
                    tipo: document.getElementById("tipo").value,
                    valor: parseFloat(document.getElementById("valor").value),
                    data: document.getElementById("data").value,
                    descricao: document.getElementById("descricao").value,
                    categoria_id: document.getElementById("categoria").value || null
                };

                if (editandoId) {
                    // UPDATE
                    await fetch(API + "/movimentacoes/" + editandoId, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(movimentacao)
                    });

                    editandoId = null;
                } else {
                    // CREATE
                    await fetch(API + "/movimentacoes", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(movimentacao)
                    });
                }

                e.target.reset();

                carregarMovimentacoes();
                carregarSaldo();
            });

            document.getElementById("filtroTipo").addEventListener("change", () => {
                carregarMovimentacoes();
            });

            carregarCategorias();
            carregarMovimentacoes();
            carregarSaldo();
        </script>
    </div>
</body>

</html>
