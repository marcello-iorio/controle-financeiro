<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Controle Financeiro</title>
</head>

<body>
    <div class="container">
        <h1>Controle Financeiro</h1>

        <h2>Nova Movimentação</h2>

        <form id="form">
            <select id="tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>
            <select id="categoria"></select>

            <input type="number" id="valor" placeholder="Valor" required>
            <input type="date" id="data" required>
            <input type="text" id="descricao" placeholder="Descrição">

            <button type="submit">Cadastrar</button>
        </form>

        <h2>Saldo Atual</h2>
        <p id="saldo">Carregando...</p>

        <h2>Movimentações</h2>
        <ul id="lista"></ul>

        <script>
            const API = "http://127.0.0.1:5000";

            async function carregarMovimentacoes() {
                const response = await fetch(API + "/movimentacoes");
                const dados = await response.json();

                const lista = document.getElementById("lista");
                lista.innerHTML = "";

                dados.forEach(m => {
                    const item = document.createElement("li");
                    item.textContent = `${m.descricao} - ${m.categoria} - R$ ${m.valor}`
                    if (m.tipo === "entrada") {
                        item.classList.add("entrada");
                    } else {
                        item.classList.add("saida");
                    }
                    lista.appendChild(item);
                });
            }

            async function carregarSaldo() {
                const response = await fetch(API + "/saldo");
                const dados = await response.json();

                const saldoElemento = document.getElementById("saldo");
                saldoElemento.textContent = "R$ " + dados.saldo;

                if (dados.saldo >= 0) {
                    saldoElemento.style.color = "#2ecc71";
                } else {
                    saldoElemento.style.color = "#e74c3c";
                }
            }

            async function carregarCategorias() {
                const response = await fetch(API + "/categorias");
                const categorias = await response.json();

                const select = document.getElementById("categoria");
                select.innerHTML = "";

                categorias.forEach(c => {
                    const option = document.createElement("option");
                    option.value = c.id;
                    option.textContent = c.nome;
                    select.appendChild(option);
                });
            }

            document.getElementById("form").addEventListener("submit", async (e) => {
                e.preventDefault();

                const movimentacao = {
                    tipo: document.getElementById("tipo").value,
                    categoria_id: document.getElementById("categoria").value,
                    valor: parseFloat(document.getElementById("valor").value),
                    data: document.getElementById("data").value,
                    descricao: document.getElementById("descricao").value
                };

                await fetch(API + "/movimentacoes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(movimentacao)
                });

                carregarMovimentacoes();
                carregarSaldo();
            });

            carregarCategorias();
            carregarMovimentacoes();
            carregarSaldo();
        </script>
    </div>
</body>

</html>
