<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { gray: { 850: '#1f2937', 900: '#111827' } }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">
    
    <div id="toast" class="fixed top-5 right-5 px-6 py-3 rounded-lg shadow-lg font-medium transition-all duration-300 transform translate-x-full opacity-0 z-50"></div>

    <div class="max-w-5xl mx-auto space-y-6">
        
        <header class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tight">Controle Financeiro</h1>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="bg-gradient-to-br from-gray-800 to-gray-850 rounded-2xl p-6 border border-gray-700/50 shadow-lg flex flex-col justify-center">
                <div class="flex justify-between items-start mb-2">
                    <h2 id="saldoTitulo" class="text-gray-400 font-medium">Saldo Atual</h2>
                    <select id="filtroTipo" class="bg-gray-900 text-xs text-gray-300 border border-gray-700 rounded-md px-2 py-1 outline-none focus:border-blue-500 transition-colors cursor-pointer">
                        <option value="todos">Todos</option>
                        <option value="entrada">Entradas</option>
                        <option value="saida">Saídas</option>
                    </select>
                </div>
                <p id="saldo" class="text-4xl font-bold tracking-tight mt-2">Carregando...</p>
            </div>

            <div class="md:col-span-2 bg-gray-800 rounded-2xl p-6 border border-gray-700/50 shadow-lg">
                <h2 class="text-lg font-semibold text-gray-200 mb-5">Nova Movimentação</h2>
                
                <form id="form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    
                    <select id="tipo" class="bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>

                    <div class="flex space-x-2">
                        <div class="w-full relative">
                            <select id="categoria" class="bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="" disabled selected>Selecione uma categoria</option>
                            </select>
                            
                            <input type="text" id="novaCategoria" placeholder="Nome da nova categoria" class="bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 outline-none absolute top-0 left-0" style="display: none;">
                        </div>

                        <button type="button" class="btn-confirmar bg-emerald-600 hover:bg-emerald-500 text-white px-3 rounded-lg transition-colors border border-emerald-500 shadow-lg" onclick="criarCategoria()" style="display: none;">
                            <i class="fas fa-check"></i>
                        </button>

                        <button type="button" class="btn-add-categoria bg-gray-700 hover:bg-gray-600 text-white px-3 rounded-lg transition-colors border border-gray-600" onclick="toggleCategoria()">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>

                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">R$</span>
                        <input type="number" step="0.01" id="valor" placeholder="0.00" required class="bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-lg block w-full pl-10 p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                    <input type="date" id="data" required class="bg-gray-900 border border-gray-700 text-gray-400 text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">

                    <div class="sm:col-span-2 flex flex-col sm:flex-row gap-4">
    <input type="text" id="descricao" placeholder="Descrição da movimentação" class="bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
    
    <button type="submit" class="shrink-0 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg text-sm px-6 py-2.5 transition-colors shadow-lg shadow-blue-500/20 whitespace-nowrap min-w-[120px]">
        Cadastrar
    </button>
</div>
                </form>
            </div>
        </div>

        <div class="bg-gray-800 rounded-2xl border border-gray-700/50 shadow-lg overflow-hidden">
            <div class="p-6 border-b border-gray-700/50">
                <div class="flex flex-wrap gap-3 items-end">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-400">De</label>
                        <input type="date" id="filtroDataInicio" class="bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" onchange="carregarMovimentacoes()">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-400">Até</label>
                        <input type="date" id="filtroDataFim" class="bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" onchange="carregarMovimentacoes()">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-400">Categoria</label>
                        <select id="filtroCategoria" class="bg-gray-900 border border-gray-700 text-gray-300 text-sm rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" onchange="carregarMovimentacoes()">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="flex gap-2 ml-auto items-end">
                        <button onclick="filtroRapido('mes')" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-2 rounded-lg transition-colors border border-gray-600">Este mês</button>
                        <button onclick="filtroRapido('ano')" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-2 rounded-lg transition-colors border border-gray-600">Este ano</button>
                        <button onclick="limparFiltros()" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-2 rounded-lg transition-colors border border-gray-600">Limpar</button>
                        <div class="w-px h-6 bg-gray-600 self-center"></div>
                        <button onclick="exportarExcel()" class="text-xs bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg transition-colors border border-emerald-600 flex items-center gap-1"><i class="fas fa-file-excel text-xs"></i> Excel</button>
                        <button onclick="exportarPDF()" class="text-xs bg-rose-700 hover:bg-rose-600 text-white px-3 py-2 rounded-lg transition-colors border border-rose-600 flex items-center gap-1"><i class="fas fa-file-pdf text-xs"></i> PDF</button>
                    </div>
                </div>
            </div>
            
            <ul id="lista" class="divide-y divide-gray-700/50">
                </ul>
        </div>

        <script>
            let editandoId = null;
            const API = "http://127.0.0.1:5000";

                        // Filtro automático ao mudar as datas
        

            async function carregarMovimentacoes() {
                const filtroTipo      = document.getElementById("filtroTipo").value;
                const dataInicio      = document.getElementById("filtroDataInicio").value;
                const dataFim         = document.getElementById("filtroDataFim").value;
                const categoriaId     = document.getElementById("filtroCategoria").value;

                if (dataInicio && dataFim && dataInicio > dataFim) {
                    mostrarToast("Data inicial não pode ser maior que a final", "erro");
                    return;
                }

                const params = new URLSearchParams();
                if (filtroTipo && filtroTipo !== "todos") params.append("tipo", filtroTipo);
                if (dataInicio)  params.append("data_inicio", dataInicio);
                if (dataFim)     params.append("data_fim", dataFim);
                if (categoriaId) params.append("categoria_id", categoriaId);

                const response = await fetch(`${API}/movimentacoes?${params}`);
                const dados = await response.json();
                dadosAtuais = dados;

                const saldoFiltrado = calcularSaldoFiltrado(dados, filtroTipo);
                
                const titulo = document.querySelector("#saldoTitulo");
                const saldoEl = document.getElementById("saldo");
                
                saldoEl.textContent = `R$ ${saldoFiltrado.toFixed(2)}`;

                if (filtroTipo === "entrada") {
                    saldoEl.className = "text-4xl font-bold tracking-tight mt-2 text-emerald-400";
                    titulo.textContent = "Total de Entradas";
                } else if (filtroTipo === "saida") {
                    saldoEl.className = "text-4xl font-bold tracking-tight mt-2 text-rose-400";
                    titulo.textContent = "Total de Saídas";
                } else {
                    saldoEl.className = `text-4xl font-bold tracking-tight mt-2 ${saldoFiltrado >= 0 ? "text-emerald-400" : "text-rose-400"}`;
                    titulo.textContent = "Saldo Atual";
                }

                const lista = document.getElementById("lista");
                lista.innerHTML = "";

                if (dados.length === 0) {
                    lista.innerHTML = `<li class="p-8 text-center text-gray-500 text-sm">Nenhuma movimentação encontrada para os filtros selecionados.</li>`;
                    return;
                }

                dados.forEach(m => {
                    const item = document.createElement("li");
                    item.className = "p-4 hover:bg-gray-750/50 transition-colors flex items-center justify-between group";

                    const valor = Number(m.valor).toFixed(2);
                    const dataFormatada = new Date(m.data).toLocaleDateString("pt-BR", {timeZone: 'UTC'});
                    
                    const isEntrada = m.tipo === "entrada";
                    const corTexto = isEntrada ? "text-emerald-400" : "text-rose-400";
                    const sinal = isEntrada ? "+" : "-";
                    const icone = isEntrada ? "fa-arrow-up" : "fa-arrow-down";
                    const bgIcone = isEntrada ? "bg-emerald-500/10 text-emerald-400" : "bg-rose-500/10 text-rose-400";

                    item.innerHTML = `
                        <div class="flex items-center space-x-4">
                            <div class="w-10 h-10 rounded-full ${bgIcone} flex items-center justify-center shrink-0">
                                <i class="fas ${icone}"></i>
                            </div>
                            <div>
                                <p class="text-gray-200 font-medium">${m.categoria || "Sem categoria"}</p>
                                <p class="text-xs text-gray-400">${isEntrada ? 'Entrada' : 'Saída'} ${m.descricao ? '• ' + m.descricao : ''} • ${dataFormatada}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <span class="${corTexto} font-semibold whitespace-nowrap">${sinal} R$ ${valor}</span>
                            <button class="btn-editar text-gray-500 hover:text-blue-400 opacity-0 group-hover:opacity-100 transition-all p-2" title="Editar">
                                <i class="fas fa-pen text-sm"></i>
                            </button>
                            <button class="btn-excluir text-gray-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition-all p-2" title="Excluir">
                                <i class="fas fa-trash text-sm"></i>
                            </button>
                        </div>
                    `;

                    item.querySelector('.btn-editar').onclick = () => carregarParaEdicao(m);
                    item.querySelector('.btn-excluir').onclick = () => excluirMovimentacao(m.id);
                    lista.appendChild(item);
                });
                
            }

            async function excluirMovimentacao(id) {
                if (!confirm("Tem certeza que deseja excluir esta movimentação?")) return;

                try {
                    const response = await fetch(`${API}/movimentacoes/${id}`, { method: "DELETE" });
                    if (!response.ok) throw new Error();
                    mostrarToast("Movimentação excluída!");
                    carregarMovimentacoes();
                    // carregarSaldo();
                } catch {
                    mostrarToast("Erro ao excluir movimentação", "erro");
                }
            }

            function filtroRapido(periodo) {
                const hoje = new Date();
                const ini  = new Date();

                if (periodo === 'mes') {
                    ini.setDate(1);
                } else if (periodo === 'ano') {
                    ini.setMonth(0);
                    ini.setDate(1);
                }

                document.getElementById("filtroDataInicio").value = ini.toISOString().split("T")[0];
                document.getElementById("filtroDataFim").value    = hoje.toISOString().split("T")[0];
                carregarMovimentacoes();
            }

            function limparFiltros() {
                document.getElementById("filtroDataInicio").value = "";
                document.getElementById("filtroDataFim").value    = "";
                document.getElementById("filtroCategoria").value  = "";
                document.getElementById("filtroTipo").value       = "todos";
                carregarMovimentacoes();
            }

            let dadosAtuais = [];

            function obterDadosParaExportar() {
                return dadosAtuais.map(m => ({
                    Tipo: m.tipo === "entrada" ? "Entrada" : "Saída",
                    Categoria: m.categoria || "Sem categoria",
                    Descrição: m.descricao || "",
                    Valor: Number(m.valor).toFixed(2),
                    Data: new Date(m.data).toLocaleDateString("pt-BR", { timeZone: "UTC" })
                }));
            }

            async function exportarExcel() {
                if (!dadosAtuais.length) { mostrarToast("Nenhum dado para exportar", "erro"); return; }

                try {
                    const response = await fetch(`${API}/movimentacoes/exportar/excel`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dadosAtuais)
                    });

                    if (!response.ok) throw new Error();

                    const blob = await response.blob();
                    const url  = URL.createObjectURL(blob);
                    const a    = document.createElement("a");
                    a.href     = url;
                    a.download = "movimentacoes.xlsx";
                    a.click();
                    URL.revokeObjectURL(url);
                    mostrarToast("Excel exportado!");
                } catch {
                    mostrarToast("Erro ao exportar Excel", "erro");
                }
            }

            async function exportarPDF() {
                if (!dadosAtuais.length) { mostrarToast("Nenhum dado para exportar", "erro"); return; }

                // Função simples para inverter a data de yyyy-mm-dd para dd/mm/yyyy
                const formatarDataBR = (data) => data.split('-').reverse().join('/');

                const filtros = [];
                const di   = document.getElementById("filtroDataInicio").value;
                const df   = document.getElementById("filtroDataFim").value;
                const cat  = document.getElementById("filtroCategoria").selectedOptions[0]?.text;
                const tipo = document.getElementById("filtroTipo").value;
                if (di)  filtros.push("De: " + formatarDataBR(di));
                if (df)  filtros.push("Até: " + formatarDataBR(df));
                if (cat && cat !== "Todas") filtros.push("Categoria: " + cat);
                if (tipo !== "todos") filtros.push("Tipo: " + tipo);

                const params = filtros.length ? "?filtros=" + encodeURIComponent(filtros.join(" | ")) : "";

                try {
                    const response = await fetch(`${API}/movimentacoes/exportar/pdf${params}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dadosAtuais)
                    });

                    if (!response.ok) throw new Error();

                    const blob = await response.blob();
                    const url  = URL.createObjectURL(blob);
                    const a    = document.createElement("a");
                    a.href     = url;
                    a.download = "movimentacoes.pdf";
                    a.click();
                    URL.revokeObjectURL(url);
                    mostrarToast("PDF exportado!");
                } catch {
                    mostrarToast("Erro ao exportar PDF", "erro");
                }
            }

            function calcularSaldoFiltrado(movimentacoes, filtro) {
                let total = 0;
                movimentacoes.forEach(m => {
                    if (filtro === "entrada" && m.tipo === "entrada") total += Number(m.valor);
                    else if (filtro === "saida" && m.tipo === "saida") total += Number(m.valor);
                    else if (filtro === "todos") {
                        if (m.tipo === "entrada") total += Number(m.valor);
                        else total -= Number(m.valor);
                    }
                });
                return total;
            }

            function toggleCategoria() {
                const select = document.getElementById("categoria");
                const input = document.getElementById("novaCategoria");
                const btnAdd = document.querySelector(".btn-add-categoria i");
                const btnConfirm = document.querySelector(".btn-confirmar");

                const criando = input.style.display === "block";

                if (criando) {
                    input.style.display = "none";
                    btnConfirm.style.display = "none";
                    select.style.display = "block";
                    btnAdd.className = "fas fa-plus";
                } else {
                    input.style.display = "block";
                    btnConfirm.style.display = "block";
                    select.style.display = "none";
                    btnAdd.className = "fas fa-times";
                    input.focus();
                }
            }

            function carregarParaEdicao(m) {
                const dataFormatada = new Date(m.data).toISOString().split("T")[0];

                document.getElementById("tipo").value = m.tipo;
                document.getElementById("valor").value = m.valor;
                document.getElementById("data").value = dataFormatada;
                document.getElementById("descricao").value = m.descricao || "";
                document.getElementById("categoria").value = m.categoria_id || "";

                editandoId = m.id;
                document.querySelector("button[type='submit']").textContent = "Atualizar Movimentação";
            }

            async function carregarSaldo() {
                const response = await fetch(API + "/saldo");
                const dados = await response.json();
                const saldoElemento = document.getElementById("saldo");
                
                saldoElemento.textContent = "R$ " + dados.saldo.toFixed(2);
                saldoElemento.className = `text-4xl font-bold tracking-tight mt-2 ${dados.saldo >= 0 ? "text-emerald-400" : "text-rose-400"}`;
            }

            async function carregarCategorias() {
                const response = await fetch(API + "/categorias");
                const categorias = await response.json();
                
                const selectForm   = document.getElementById("categoria");
                const selectFiltro = document.getElementById("filtroCategoria");
                
                selectForm.innerHTML = `<option value="" disabled selected>Selecione uma categoria</option>`;
                selectFiltro.innerHTML = `<option value="">Todas</option>`;

                categorias.forEach(c => {
                    const opt = `<option value="${c.id}">${c.nome}</option>`;
                    selectForm.innerHTML   += opt;
                    selectFiltro.innerHTML += opt;
                });
            }

            async function criarCategoria() {
                const nome = document.getElementById("novaCategoria").value;
                if (!nome) return;

                try {
                    const response = await fetch(API + "/categorias", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ nome })
                    });

                    if (!response.ok) throw new Error();
                    const nova = await response.json();
                    
                    await carregarCategorias();
                    document.getElementById("categoria").value = nova.id;
                    document.getElementById("novaCategoria").value = "";
                    toggleCategoria();
                    mostrarToast("Categoria criada!");
                } catch {
                    mostrarToast("Erro ao criar categoria", "erro");
                }
            }

            // Sistema de Toast Moderno (Substitui o antigo)
            function mostrarToast(texto, tipo = "sucesso") {
                const toast = document.getElementById("toast");
                
                // Reseta classes do Tailwind para o Toast
                toast.className = `fixed top-5 right-5 px-6 py-3 rounded-lg shadow-lg font-medium transition-all duration-300 transform z-50 flex items-center space-x-2 ${
                    tipo === "sucesso" ? "bg-emerald-500 text-white" : "bg-rose-500 text-white"
                }`;

                toast.innerHTML = `<i class="fas ${tipo === 'sucesso' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${texto}</span>`;
                
                // Animação de entrada
                setTimeout(() => {
                    toast.classList.remove("translate-x-full", "opacity-0");
                }, 10);

                // Animação de saída
                setTimeout(() => {
                    toast.classList.add("translate-x-full", "opacity-0");
                }, 3000);
            }

            document.getElementById("form").addEventListener("submit", async (e) => {
                e.preventDefault();

                const movimentacao = {
                    tipo: document.getElementById("tipo").value,
                    valor: parseFloat(document.getElementById("valor").value),
                    data: document.getElementById("data").value,
                    descricao: document.getElementById("descricao").value,
                    categoria_id: document.getElementById("categoria").value || null
                };

                const method = editandoId ? "PUT" : "POST";
                const url = editandoId ? `${API}/movimentacoes/${editandoId}` : `${API}/movimentacoes`;

                try {
                    const response = await fetch(url, {
                        method: method,
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(movimentacao)
                    });

                    if (!response.ok) throw new Error();

                    mostrarToast(editandoId ? "Movimentação atualizada!" : "Movimentação cadastrada!");
                    
                    // Resetar form e estado
                    editandoId = null;
                    document.querySelector("button[type='submit']").textContent = "Cadastrar";
                    e.target.reset();

                } catch (err) {
                    mostrarToast("Erro ao salvar movimentação", "erro");
                }

                carregarMovimentacoes();
                carregarSaldo();
            });

            document.getElementById("novaCategoria").addEventListener("keydown", async (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    criarCategoria();
                }
            });

            

            // Inicialização
            carregarCategorias();
            carregarMovimentacoes();
            carregarSaldo();

            document.getElementById("filtroDataInicio").addEventListener("change", carregarMovimentacoes);
            document.getElementById("filtroDataFim").addEventListener("change", carregarMovimentacoes);
            document.getElementById("filtroTipo").addEventListener("change", carregarMovimentacoes);
        </script>
    </div>
</body>
</html>
